name: Build baked image

# Builds the baked-mode rootfs for Lumina's agent path around the
# Kata kernel (Guest/fetch-kernel.sh).
#
# Triggers:
#   - Manual via `workflow_dispatch` ONLY.
#
# Tag publishing deliberately lives in release.yml, which builds the CLI and
# the image in one run and publishes both. Commit 984c2e3 (2026-04-10) merged
# them for exactly that reason: two tag-triggered workflows race, and whichever
# finishes first fails with "release not found". Do not add a tag trigger here.
#
# Runner:
#   - `ubuntu-24.04-arm` (native ARM64; no QEMU emulation)
#
# Output:
#   - `vmlinuz` (Kata arm64 kernel, ~19MB)
#   - `rootfs.img` (ext4, ~1GB, contains agent + init)
#   - Packaged as `lumina-image-default.tar.gz` release asset.

on:
  workflow_dispatch:
    inputs:
      publish_as_release_asset:
        description: "Attach to latest GitHub Release"
        type: boolean
        default: false

# The default workflow token is read-only, so `gh release upload` returned
# "HTTP 403: Resource not accessible by integration" — after a successful
# 10-minute kernel build. The image was built, then thrown away.
permissions:
  contents: write

jobs:
  build:
    name: Kernel + baked image
    # ubuntu-24.04-arm: public preview GA'd 2025; check availability in
    # your org's runner allowlist. Fallback = `ubuntu-latest` + qemu.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y curl e2fsprogs zstd

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: Guest/lumina-agent/go.sum

      - name: Build guest agent
        run: |
          cd Guest/lumina-agent
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -ldflags="-s -w" -o lumina-agent .
          ls -la lumina-agent

      - name: Fetch guest kernel
        run: bash Guest/fetch-kernel.sh /tmp/lumina-kernel/vmlinuz

      - name: Build baked image
        run: |
          mkdir -p /tmp/lumina-image-out
          LUMINA_KERNEL=/tmp/lumina-kernel/vmlinuz \
            bash Guest/build-image.sh /tmp/lumina-image-out
          ls -la /tmp/lumina-image-out/
          # Baked-mode output is 2 files: vmlinuz + rootfs.img.
          # No initrd, no modules/ dir.

      - name: Package as release asset
        run: |
          cd /tmp/lumina-image-out
          tar czf /tmp/lumina-image-default.tar.gz vmlinuz rootfs.img
          ls -la /tmp/lumina-image-default.tar.gz

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumina-image-default-baked
          path: /tmp/lumina-image-default.tar.gz
          retention-days: 30

      # Tag-triggered: attach to the release.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/lumina-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            /tmp/lumina-image-default.tar.gz \
            --clobber

      # Manual trigger with publish_as_release_asset=true
      - name: Attach to latest release (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.publish_as_release_asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          if [ -z "$LATEST" ]; then
            echo "::error::No releases to attach to"
            exit 1
          fi
          gh release upload "$LATEST" \
            /tmp/lumina-image-default.tar.gz \
            --clobber
